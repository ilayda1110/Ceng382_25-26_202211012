<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title> Scout Regiment </title>
		<link rel="stylesheet" href="style.css" />
		<!-- Icons -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />	
	</head>
	<body>
		<div class="shield-container" id="shield">			
			<div class="shield">
				<div class="line1"></div>
				<div class="line2"></div>
				<div class="wing left">
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
				</div>
				<div class="wing right">
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
					<div class="feather"></div>
				</div>
				<div class="wing2 left2">
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
				</div>
				<div class="wing2 right2">
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
					<div class="feather2"></div>
				</div>
				<div class="wing3 left3">
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
				</div>
				<div class="wing3 right3">
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
					<div class="feather3"></div>
				</div>
			</div>			
		</div>

		<audio id="wingSoundEffect">
			<source src="wingOpening.MP3">
		</audio>

		<audio id="song">
			<source src="0303.MP3">
		</audio>

		<div class="clock-container">
			<div class="clock" id="clock"></div>
		</div>

		<div class="wrapper">
			<div class="title">
				<div class="flipH">
					<div class="sword">
						<div class="blade-lines"></div>
						<div class="blade-lines"></div>
						<div class="blade-lines"></div>
						<div class="blade-lines"></div>
						<div class="hilt"></div>
						<div class="handle"></div>
					</div>
				</div>
				<span>Scout Regiment Login</span>
				<div class="sword">
					<div class="blade-lines"></div>
					<div class="blade-lines"></div>
					<div class="blade-lines"></div>
					<div class="blade-lines"></div>
					<div class="hilt"></div>
					<div class="handle"></div>
				</div>
			</div>
			<form action="#">
				<div class="row">
					<i class="fas fa-user"></i>
					<input id="username" type="text" placeholder="Scout Username" required />
				</div>
				<div class="row">
					<i class="fas fa-lock"></i>
					<input id="password" type="password" placeholder="Password" required />
				</div>
				<div class="pass"><a href="#">Forgot Password?</a></div>
				<div class="row button" id="submit">
					<input type="submit" value="Login" />
				</div>
			</form>
		</div>

		<script src="script.js"></script>
	</body>
</html>
