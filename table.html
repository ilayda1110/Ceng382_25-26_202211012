<!--  

My table.html is like this:
This page should include:  
o A class information input form with the following fields:  
▪ Class Name 
▪ Number of People 
▪ Description 
o A class table that displays the entered class information, showing the above details 
for each entry. 

Implement functionality so that when data is entered and submitted via the form, the class  
table updates dynamically without reloading the page

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <link rel="stylesheet" href="styleTable.css">
</head>
<body>
    <div class="infoForm">
        <div class="formTitle">
            <span>Class Information Form</span>
        </div>
        <form id="classForm">
            <div class="classNameText">
                <span>Class Name:</span>
                <input type="text" id="className" required>
            </div>
            <div class="numOfPeopleText">
                <span>Number Of People:</span>
                <input type="number" id="numPeople" required>
            </div>
            <div class="descriptionText">
                <span>Description:</span>
                <input type="description" id="description" required></textarea>
            </div>
            <button type="submit" id="submitBtn">Add Class</button>
        </form>
    </div>
    
    <div class="classTableWrapper">
        <div class="classTable">
            <div class="classTableTitle">
                <span>Class Table</span>
            </div>
            <table border="1">
                <thead>
                    <tr>
                        <th class="className">Class Name</th>
                        <th class="numofpeople">Number of People</th>
                        <th class="description">Description</th>
                        <th class="actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="classTableBody" class="tableBody">
                    <!-- Table rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>
    

    <script src="tablescript.js"></script>
    
</body>
</html>
